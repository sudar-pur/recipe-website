<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog | Deep Roots</title>
  <meta name="description" content="High-protein vegetarian tips and guides from Deep Roots.">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Deep Roots">
  <meta name="twitter:card" content="summary">
  <!-- Dynamic meta tags injected by JS -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2711708712180550" crossorigin="anonymous"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VLXBNDGJ94"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-VLXBNDGJ94');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <div class="nav-logo-icon">DR</div>
        <span class="nav-logo-text">Deep Roots</span>
      </a>
      <button class="nav-toggle" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links">
        <li><a href="index.html">Recipes</a></li>
        <li><a href="search.html">Search</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </div>
  </nav>

  <!-- Blog Post Content (dynamically rendered) -->
  <div class="blog-post-page" id="blog-post-container">
    <p style="text-align:center; padding: 80px 0; color: #999;">Loading post...</p>
  </div>

  <!-- Ad Unit: Below Blog Content -->
  <div class="ad-container">
    <ins class="adsbygoogle"
      style="display:block"
      data-ad-client="ca-pub-2711708712180550"
      data-ad-slot="XXXXXXXXXX"
      data-ad-format="auto"
      data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-logo">Deep Roots</div>
      <p class="footer-tagline">Protein-Forward Vegetarian Cooking</p>
      <ul class="footer-links">
        <li><a href="index.html">Recipes</a></li>
        <li><a href="search.html">Search</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="blog.html">Blog</a></li>
        <li><a href="privacy.html">Privacy</a></li>
      </ul>
      <p class="footer-copy">&copy; 2025 Deep Roots. Built with love, lentils, and a lot of protein.</p>
    </div>
  </footer>

  <script src="js/blog-posts.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Mobile nav toggle
      var toggle = document.querySelector('.nav-toggle');
      var links = document.querySelector('.nav-links');
      if (toggle && links) {
        toggle.addEventListener('click', function() {
          links.classList.toggle('open');
        });
      }

      var container = document.getElementById('blog-post-container');
      if (!container || typeof blogPosts === 'undefined') return;

      var params = new URLSearchParams(window.location.search);
      var slug = params.get('p');
      var post = blogPosts.find(function(p) { return p.slug === slug; });

      if (!post) {
        container.innerHTML =
          '<div style="text-align:center; padding: 80px 24px;">' +
            '<h2>Post not found</h2>' +
            '<p style="margin: 16px 0;">The blog post you\'re looking for doesn\'t exist.</p>' +
            '<a href="blog.html" class="jump-to-recipe">Browse All Posts</a>' +
          '</div>';
        return;
      }

      // Update page title and meta
      document.title = post.title + ' | Deep Roots Blog';

      var metaDesc = document.querySelector('meta[name="description"]');
      if (metaDesc) metaDesc.setAttribute('content', post.excerpt);

      var url = 'https://deeprootscooking.com/blog-post.html?p=' + post.slug;

      // Canonical
      var canonical = document.createElement('link');
      canonical.rel = 'canonical';
      canonical.href = url;
      document.head.appendChild(canonical);

      // OG tags
      var ogTags = {
        'og:title': post.title + ' | Deep Roots Blog',
        'og:description': post.excerpt,
        'og:url': url
      };
      for (var prop in ogTags) {
        var existing = document.querySelector('meta[property="' + prop + '"]');
        if (existing) {
          existing.setAttribute('content', ogTags[prop]);
        } else {
          var tag = document.createElement('meta');
          tag.setAttribute('property', prop);
          tag.setAttribute('content', ogTags[prop]);
          document.head.appendChild(tag);
        }
      }

      // JSON-LD
      var jsonLd = {
        '@context': 'https://schema.org',
        '@type': 'BlogPosting',
        'headline': post.title,
        'description': post.excerpt,
        'datePublished': post.date,
        'author': { '@type': 'Organization', 'name': 'Deep Roots' },
        'publisher': { '@type': 'Organization', 'name': 'Deep Roots' },
        'url': url,
        'keywords': post.tags.join(', ')
      };
      var script = document.createElement('script');
      script.type = 'application/ld+json';
      script.textContent = JSON.stringify(jsonLd);
      document.head.appendChild(script);

      // Format date
      var d = new Date(post.date + 'T00:00:00');
      var dateStr = d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

      // Find next and previous posts
      var sorted = blogPosts.slice().sort(function(a, b) {
        return new Date(a.date) - new Date(b.date);
      });
      var currentIndex = sorted.findIndex(function(p) { return p.slug === slug; });
      var prevPost = currentIndex > 0 ? sorted[currentIndex - 1] : null;
      var nextPost = currentIndex < sorted.length - 1 ? sorted[currentIndex + 1] : null;

      // Render
      container.innerHTML =
        '<div class="blog-post-breadcrumb">' +
          '<a href="index.html">Home</a> / <a href="blog.html">Blog</a> / ' + post.title +
        '</div>' +
        '<h1 class="blog-post-title">' + post.title + '</h1>' +
        '<div class="blog-post-meta">' +
          '<span class="blog-post-date">' + dateStr + '</span>' +
        '</div>' +
        '<div class="blog-post-content">' + post.content + '</div>' +
        '<div class="blog-post-tags">' +
          post.tags.map(function(tag) {
            return '<span class="recipe-tag">#' + tag + '</span>';
          }).join('') +
        '</div>' +
        '<div class="blog-post-nav">' +
          (prevPost
            ? '<a href="blog-post.html?p=' + prevPost.slug + '" class="blog-post-nav-link blog-post-nav-prev">' +
                '<span class="blog-post-nav-label">&larr; Previous</span>' +
                '<span class="blog-post-nav-title">' + prevPost.title + '</span>' +
              '</a>'
            : '<span></span>') +
          (nextPost
            ? '<a href="blog-post.html?p=' + nextPost.slug + '" class="blog-post-nav-link blog-post-nav-next">' +
                '<span class="blog-post-nav-label">Next &rarr;</span>' +
                '<span class="blog-post-nav-title">' + nextPost.title + '</span>' +
              '</a>'
            : '<span></span>') +
        '</div>';
    });
  </script>
</body>
</html>
